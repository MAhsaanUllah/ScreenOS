name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build workspace
        working-directory: frontend
        run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t screenos:smoke .
      - name: Run container
        run: docker run -d -p 8000:8000 --name screenos screenos:smoke
      - name: Smoke test index response
        run: |
          success=0
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:8000/ > response.html 2>/dev/null; then
              if grep -q "/assets/" response.html; then
                echo "React UI assets detected in GET / response."
                success=1
                break
              fi
            fi
            sleep 1
          done
          if [ $success -ne 1 ]; then
            echo "Smoke test failed! Response content:"
            cat response.html 2>/dev/null || true
            echo "Showing docker logs:"
            docker logs screenos
            exit 1
          fi
      - name: Stop container
        if: always()
        run: docker stop screenos || true
